name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit & API tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Dataset is reproducible from its sources
        run: python -m pipeline check
      - name: Data files match their schemas and agree with each other
        run: python -m pipeline.validate
      - name: Immigration records match their sources
        run: python -m relocaitor.immigration check
      - name: Semantic index matches visas.json and the concept prototypes
        run: python -m ml.build_semantic_index --check
      # Browser tests skip themselves here (no browser installed); they run in the e2e job.
      - run: python -m pytest -q --ignore=tests/e2e

  e2e:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/e2e

  semantic:
    name: Sentence-embedding model (real all-MiniLM-L6-v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: ml/models
          key: minilm-l6-v2-onnx
      - name: Download the model and re-embed the corpus
        run: python -m ml.build_semantic_index --download
      - name: Real-model tests
        run: python -m pytest -q tests/ml/test_semantic.py
      - name: Tune on dev data, score on test data
        run: python -m ml.evaluate_semantic
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-evaluation
          path: |
            ml/semantic_index.json
            ml/semantic_eval.json
